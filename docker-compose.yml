# docker-compose.yml
services:
  trino:
    image: trinodb/trino:479
    container_name: trino
    ports:
      - "8080:8080"
      - "5005:5005"   # JDWP
    environment:
      # Trino official image supports this pattern; if it doesn't in your tag,
      # use Option B below.
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # GeoIP MMDB paths — uncomment together with the volume bind below
      # to test ip_to_country/latitude/longitude UDFs against a real MMDB.
      # Defaults to /usr/lib/trino/plugin/GeoLite2-*.mmdb if unset.
      # ULAK_GEOIP_COUNTRY_DB: /data/GeoLite2-Country.mmdb
      # ULAK_GEOIP_CITY_DB:    /data/GeoLite2-City.mmdb
    volumes:
      # Trino server config
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/log.properties:/etc/trino/log.properties:ro

      # Catalogs (your connector config lives here)
      - ./trino/etc/catalog:/etc/trino/catalog:ro

      # Your custom connector plugin directory (built output)
      # IMPORTANT: this must be the DIRECTORY that contains the connector JAR + dependency-jars/
      # Example local path: ./plugins/myconnector/
      - ./ulak-presto-quickwit-connector/target:/usr/lib/trino/plugin/quicwitconnector:ro

      # GeoIP MMDB files — license-restricted, gitignored, present only on
      # developer workstations. Uncomment together with the ULAK_GEOIP_*_DB
      # env vars above to test ip_to_country / ip_to_latitude /
      # ip_to_longitude UDFs against a real MMDB. Without these the UDFs
      # return "" and log a WARN; the rest of the catalog keeps working.
      # See geolocation/README.md for the production K8s pattern.
      # - ./geolocation/maxmind/GeoLite2-Country_20240917/GeoLite2-Country.mmdb:/data/GeoLite2-Country.mmdb:ro
      # - ./geolocation/maxmind/GeoLite2-City_20240917/GeoLite2-City.mmdb:/data/GeoLite2-City.mmdb:ro

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: trino-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: trino-datasource,quickwit-quickwit-datasource,yesoreyeram-infinity-datasource,orchestracities-map-panel
      GF_FEATURE_TOGGLES_PUBLICDASHBOARDS: 'true'
      GF_PATHS_PLUGINS: /var/lib/grafana_plugins
      GF_SECURITY_DISABLE_PLUGINS_SIGNATURE_VALIDATION: 'true'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/plugins:/var/lib/grafana_plugins
    depends_on:
      trino:
        condition: service_healthy

volumes:
  grafana-data:
